[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "potato-userbot"
version = "0.1.0"
description = "A modular Telegram userbot for self-hosting"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
    "Telethon==1.45.0",
    "aiohttp==3.14.3",
    "aiosqlite==0.22.1",
    "packaging==26.3",
]

[project.scripts]
potato = "potato.__main__:main"

[tool.setuptools.packages.find]
include = ["potato*"]
