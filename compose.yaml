services:
  potato:
    image: ${POTATO_IMAGE:-potato-local}
    build:
      context: .
      args:
        POTATO_BUILD_SHA: ${POTATO_BUILD_SHA:-unknown}
    env_file: .env
    init: true
    restart: unless-stopped
    volumes:
      - potato_data:/data
    ports:
      - "127.0.0.1:${POTATO_BIND_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  potato_data:
    name: ${POTATO_VOLUME_NAME:-potato_potato_data}
